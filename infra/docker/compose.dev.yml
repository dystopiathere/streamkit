# Инфраструктура для разработки: PostgreSQL, Redis и LiveKit.
#
# Приложения здесь сознательно не контейнеризованы. На Windows bind-mount с
# symlink-структурой pnpm работает медленно и ненадёжно, а hot-reload через
# контейнер даёт секунды задержки на каждое сохранение. Поэтому базы — в Docker,
# код — на хосте (`pnpm dev`). Полная сборка всех сервисов проверяется в
# compose.yml, который повторяет прод.
name: streamkit-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamkit}
      POSTGRES_DB: ${POSTGRES_DB:-streamkit}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Без healthcheck миграции стартуют раньше готовности базы и падают
      # на первом же запуске в CI.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-streamkit} -d ${POSTGRES_DB:-streamkit}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly для разработки не нужен, но и вреда нет: переживает рестарт,
    # и дедупликация не «забывает» события при перезапуске контейнера.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Медиасервер приватных комнат. Режим --dev: встроенные ключи devkey/secret
  # (опубликованы в документации LiveKit, это не секрет) и порты по умолчанию.
  #
  # --node-ip 127.0.0.1 обязателен. Без него LiveKit объявляет браузеру адрес
  # контейнера внутри сети Docker, до которого браузер на хосте не достаёт:
  # сигнализация проходит, участник «входит», а видео и звука нет — ошибок при
  # этом ни в консоли, ни в логах.
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    command: ['--dev', '--bind', '0.0.0.0', '--node-ip', '127.0.0.1']
    # Вебхуки о каждом входе — на API, который `pnpm dev` запускает на хосте.
    # Без них отозванный гость входит обратно старым токеном: отозвать выданный
    # токен LiveKit не умеет, выгоняет его наш API по событию participant_joined.
    # host.docker.internal — адрес хоста из контейнера в Docker Desktop.
    environment:
      LIVEKIT_CONFIG: |
        webhook:
          api_key: devkey
          urls:
            - http://host.docker.internal:3000/api/livekit/webhook
    extra_hosts:
      # На Linux без Docker Desktop этого имени нет — задаём явно.
      - 'host.docker.internal:host-gateway'
    ports:
      - '7880:7880' # сигнализация и серверный API
      - '7881:7881' # медиа по TCP — запасной путь, когда UDP закрыт
      - '7882:7882/udp' # медиа по UDP

  # Почтовый ящик для разработки: принимает всё, что шлёт API, и никуда не
  # отправляет. Письма — на http://localhost:8025. Без почты продления подписки
  # не списываются, так что и в разработке она нужна.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # интерфейс

volumes:
  postgres-data:
  redis-data:
