server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Скрываем версию nginx: бесплатная подсказка для сканеров уязвимостей.
    server_tokens off;

    # Заголовки безопасности. CSP задаётся здесь, а не на API: политика касается
    # страницы, а API отдаёт только JSON.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # connect-src разрешает websocket: без wss: сокет оверлея молча не подключится.
    # 'unsafe-inline' для style-src нужен, потому что виджет задаёт стили инлайново
    # из пользовательского конфига — это его основная функция.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Хэшированные ассеты неизменяемы — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: иначе после деплоя клиент продолжит просить
    # ассеты старой сборки, которых уже нет.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Юридические документы отдаются статикой и должны открываться без авторизации.
    location /legal/ {
        try_files $uri =404;
    }

    # SPA: любой неизвестный путь отдаёт index.html, маршрутизацию делает роутер.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
