# Журнал без строки запроса и без Referer. Ссылка для OBS несёт токен оверлея
# в `?token=`, и стандартный формат писал его в лог контейнера дважды: в строке
# запроса страницы и в Referer каждого её ассета. Токен из лога — это готовый
# доступ к виджету, а для гостей — к видео приватной комнаты.
log_format streamkit '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log streamkit;

    # Скрываем версию nginx: бесплатная подсказка для сканеров уязвимостей.
    server_tokens off;

    # Заголовки безопасности — в отдельном файле и подключаются в КАЖДЫЙ
    # location ниже. Причина в правиле наследования add_header, см. сам файл.
    include /etc/nginx/snippets/security-headers.conf;

    # Хэшированные ассеты неизменяемы — кэшируем надолго.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: иначе после деплоя клиент продолжит просить
    # ассеты старой сборки, которых уже нет.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Тексты юридических документов. Только сами файлы `.md`: страница
    # `/legal/terms` — маршрут SPA, который подставляет в текст реквизиты. Раньше
    # здесь стоял `location /legal/` целиком, и прямой переход по ссылке на
    # оферту — ровно так её открывает модерация ЮKassa — отдавал 404: файла
    # `legal/terms` без расширения нет, а до index.html запрос не доходил.
    location ~ ^/legal/[a-z-]+\.md$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }

    # Главная — со статическим снимком содержимого для поисковых роботов
    # (landing.html собирает vite/seo-plugin.ts). Только корень: остальным адресам
    # SPA снимок главной не нужен, вошедший стример видел бы его вместо кабинета.
    # В сборке без landing.html (админка, оверлей) — прежний index.html.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /landing.html /index.html;
    }

    # Файлы для поисковиков — только сами файлы. Без этого правила отсутствующий
    # файл уходил в SPA и отвечал index.html с кодом 200: Search Console приняла
    # его за «файл Sitemap является страницей HTML», хотя файла просто не было.
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Манифест приложения. В mime.types у nginx 1.27 расширения .webmanifest нет,
    # и файл ушёл бы как application/octet-stream.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA: любой неизвестный путь отдаёт index.html, маршрутизацию делает роутер.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
