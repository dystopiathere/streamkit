server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Скрываем версию nginx: бесплатная подсказка для сканеров уязвимостей.
    server_tokens off;

    # Заголовки безопасности — в отдельном файле и подключаются в КАЖДЫЙ
    # location ниже. Причина в правиле наследования add_header, см. сам файл.
    include /etc/nginx/snippets/security-headers.conf;

    # Хэшированные ассеты неизменяемы — кэшируем надолго.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: иначе после деплоя клиент продолжит просить
    # ассеты старой сборки, которых уже нет.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Юридические документы отдаются статикой и должны открываться без авторизации.
    location /legal/ {
        try_files $uri =404;
    }

    # SPA: любой неизвестный путь отдаёт index.html, маршрутизацию делает роутер.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
