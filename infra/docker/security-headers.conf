# Заголовки безопасности. Подключаются через include В КАЖДЫЙ location, где
# есть свой add_header, — и это не повтор ради повтора.
#
# В nginx add_header наследуется с уровня server ТОЛЬКО если на уровне location
# нет ни одного своего add_header. Раньше эти строки стояли в server, а документ
# SPA отдавался через `location = /index.html` со своим Cache-Control, и ни
# дашборд, ни оверлей не получали ни CSP, ни X-Frame-Options: frame-ancestors не
# работал, страницу можно было встроить в чужую. Получали их только /legal/.
#
# CSP задаётся здесь, а не на API: политика касается страницы, а API отдаёт
# только JSON.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Permissions-Policy у приложений разная: дашборду нужны камера и микрофон для
# комнат, оверлею — нет. Файл подкладывается при сборке образа по APP.
include /etc/nginx/snippets/permissions.conf;

# connect-src разрешает websocket: без wss: сокет оверлея молча не подключится.
# 'unsafe-inline' для style-src нужен, потому что виджет задаёт стили инлайново
# из пользовательского конфига — это его основная функция.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
