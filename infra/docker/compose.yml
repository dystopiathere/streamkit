# Полный стек: то же, что поедет в прод, но на одной машине.
# Запуск: docker compose -f infra/docker/compose.yml --env-file .env up --build
name: streamkit

# Окружение приложения — одно на API и воркер. Раньше у воркера был свой
# урезанный список, и в нём не было ни ЮKassa, ни ключей площадок: продления
# подписки там считались «оплата не настроена» и молча не списывались, а
# токены площадок не обновлялись. Воркеру нужны те же настройки, что и API.
x-app-environment: &app-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER:-streamkit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-streamkit}?schema=public
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?нужно задать JWT_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?нужно задать ENCRYPTION_KEY}
  IP_HASH_PEPPER: ${IP_HASH_PEPPER:?нужно задать IP_HASH_PEPPER}
  TOKEN_HASH_PEPPER: ${TOKEN_HASH_PEPPER:?нужно задать TOKEN_HASH_PEPPER}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  OVERLAY_BASE_URL: ${OVERLAY_BASE_URL:-http://localhost:8081}
  # Из него собираются ссылки-приглашения в комнаты: гость открывает дашборд.
  WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8080}
  OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:3000}
  TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
  TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
  YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
  YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
  # Два адреса LiveKit, и это разные значения: API ходит внутри сети compose,
  # браузеры — на опубликованный порт или домен с TLS.
  LIVEKIT_URL: http://livekit:7880
  LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?нужно задать LIVEKIT_API_KEY}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?нужно задать LIVEKIT_API_SECRET}
  # Оплата подписки. Пустые — оплата не настроена, комнаты бесплатны.
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
  YOOKASSA_RECEIPTS: ${YOOKASSA_RECEIPTS:-none}
  YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
  # Реквизиты продавца для публичных страниц и документов.
  SELLER_NAME: ${SELLER_NAME:-}
  SELLER_INN: ${SELLER_INN:-}
  SELLER_EMAIL: ${SELLER_EMAIL:-}
  SELLER_PHONE: ${SELLER_PHONE:-}
  # Почта для писем о списании. Пустой SMTP_HOST — почта не настроена, и
  # продления подписки не списываются.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужно задать POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-streamkit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-streamkit}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Миграции выполняются отдельным одноразовым контейнером, а не при старте API.
  # Иначе при нескольких репликах несколько процессов начнут мигрировать базу
  # одновременно.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-streamkit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-streamkit}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-environment
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app-environment
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Медиасервер приватных комнат. Без --dev: ключи из окружения, и секрет обязан
  # быть не короче 32 символов — иначе LiveKit не стартует («secret is too
  # short»), а dev-ключ «secret» из .env.example здесь не подходит.
  #
  # Конфигурация целиком в LIVEKIT_CONFIG, а не в файле: вебхуку нужен ключ по
  # имени, а имя ключа приходит из окружения. Файл LiveKit не шаблонизирует, а
  # файл и LIVEKIT_CONFIG одновременно не читает — берёт что-то одно.
  #
  # --node-ip — адрес, который LiveKit сообщает браузерам для медиа. Локально
  # это 127.0.0.1, в проде — публичный IP сервера. Ошибка в нём не ломает вход:
  # участник подключается, но остаётся без видео и звука, и ошибок нет. TLS для
  # wss:// и TURN на домене — задача выкатки, см. infra/livekit/README.md.
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    command: ['--node-ip', '${LIVEKIT_NODE_IP:-127.0.0.1}']
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        rtc:
          # TCP — запасной путь для гостей за строгим NAT, где UDP закрыт.
          tcp_port: 7881
          # Один UDP-порт на всё медиа: в группе безопасности облака одна строка,
          # а не десять тысяч портов.
          udp_port: 7882
          use_external_ip: false
        room:
          # С запасом над MAX_GUESTS_PER_ROOM (8): стример, его вкладки и
          # невидимые оверлеи из нескольких сцен OBS тоже участники.
          max_participants: 20
          # Гость, перезагрузивший вкладку, не пересоздаёт комнату с нуля.
          empty_timeout: 300
        # О каждом входе LiveKit сообщает API: выданный токен отозвать нельзя, и
        # того, чья ссылка уже отозвана, выгоняет API по participant_joined.
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://api:3000/api/livekit/webhook
        logging:
          level: info
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: web
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        # Локально API и LiveKit без TLS, и CSP без этого их не пустит. В проде пусто.
        CSP_CONNECT_EXTRA: ${CSP_CONNECT_EXTRA-http://localhost:3000 ws://localhost:3000 ws://localhost:7880}
    restart: unless-stopped
    ports:
      - '8080:80'

  overlay:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: overlay
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        # Локально API и LiveKit без TLS, и CSP без этого их не пустит. В проде пусто.
        CSP_CONNECT_EXTRA: ${CSP_CONNECT_EXTRA-http://localhost:3000 ws://localhost:3000 ws://localhost:7880}
    restart: unless-stopped
    ports:
      - '8081:80'

volumes:
  postgres-data:
  redis-data:
