# Конфигурация LiveKit для compose.yml — того, что поедет в прод.
#
# Ключи здесь не лежат: они приходят переменной LIVEKIT_KEYS в формате
# «ключ: секрет», собранной из LIVEKIT_API_KEY и LIVEKIT_API_SECRET в .env. Адрес
# узла — флагом --node-ip из LIVEKIT_NODE_IP: это публичный IP сервера, который
# LiveKit сообщает браузерам для медиа. Ошибка в нём не ломает вход — участник
# подключается, — но видео и звука нет, и никаких ошибок тоже нет.

port: 7880

rtc:
  # TCP — запасной путь для гостей за строгим NAT и корпоративными сетями,
  # где UDP закрыт. Без него часть гостей «входит» и остаётся без медиа.
  tcp_port: 7881
  # Один UDP-порт на всё медиа вместо диапазона: в облачной группе
  # безопасности открывается одна строка, а не десять тысяч портов.
  udp_port: 7882
  use_external_ip: false

room:
  # Потолок на комнату с запасом над MAX_GUESTS_PER_ROOM (8): стример, его
  # вкладки и невидимые оверлеи из нескольких сцен OBS тоже участники.
  max_participants: 20
  # Пустая комната живёт пять минут: гость, перезагрузивший вкладку, не должен
  # пересоздавать её с нуля.
  empty_timeout: 300

logging:
  level: info
