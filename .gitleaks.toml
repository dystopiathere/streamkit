# Конфигурация поиска утёкших секретов.
#
# Правила берутся стандартные целиком; ниже только исключения, и каждое с
# объяснением. Исключение задано по САМОМУ значению, а не по файлу: иначе
# настоящий секрет, случайно попавший в workflow, перестал бы ловиться — то
# есть проверка молча превратилась бы в декорацию.

[extend]
useDefault = true

[allowlist]
description = """
Одноразовый ключ шифрования для прогонов CI. Лежит в открытом виде в
.github/workflows/ci.yml и секретом не является: боевые значения живут только в
окружении деплоя. Детектор срабатывает справедливо — это base64 высокой
энтропии рядом со словом KEY, — поэтому исключение перечисляет конкретные
строки, а не глушит правило.

Две записи, потому что первая осталась в истории: в ней было 32 байта только на
словах, реально 31, и прогон CI падал на проверке длины.
"""
regexes = [
  '''dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcy0hIQ==''',
  '''dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyEhISE=''',
]
