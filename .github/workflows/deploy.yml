name: Выкатка

# Только вручную: выкатка — решение человека, а не побочный эффект слияния.
# Откат — этот же workflow с тегом предыдущего выпуска.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Полный sha коммита из main. Пусто — последний выпущенный
        required: false
        default: ''
        type: string
      target:
        description: Что выкатывать
        required: true
        default: app
        type: choice
        options:
          - app
          - livekit
          - all

permissions:
  contents: read
  # Чтение прогонов «Выпуска образов» — для тега по умолчанию.
  actions: read

# Две выкатки одновременно на одни ВМ — это миграции наперегонки.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Выкатка ${{ inputs.target }} ${{ inputs.tag || 'последнего выпуска' }}
    runs-on: ubuntu-latest
    # Окружение production на GitHub: здесь секреты выкатки и, при желании,
    # обязательное подтверждение вторым человеком.
    environment: production
    steps:
      # По умолчанию — последний коммит main, для которого выпуск образов
      # действительно собрал образы. Не голова main: её выпуск может ещё идти,
      # а прогон выпуска после упавшего CI тоже «успешен» — все его задания
      # пропущены. Откат — явным тегом.
      # Тег из формы идёт в команду на сервере — проверяется до всякого
      # использования.
      - name: Тег
        id: tag
        env:
          INPUT: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$INPUT
          if [[ -z $sha ]]; then
            runs=$(gh api "repos/${GH_REPO}/actions/workflows/release.yml/runs?branch=main&status=success&per_page=30" \
              --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')
            while read -r id head; do
              built=$(gh api "repos/${GH_REPO}/actions/runs/${id}/jobs" \
                --jq '[.jobs[] | select(.conclusion == "success" and (.name | startswith("Образ ")))] | length')
              if (( built > 0 )); then sha=$head; break; fi
            done <<< "$runs"
            if [[ -z $sha ]]; then
              echo "Не нашлось выпуска с собранными образами — укажите тег явно" >&2
              exit 1
            fi
            echo "Последний выпуск: $sha"
          fi
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "Тег должен быть полным sha коммита: $sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Выкатывается \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      # Файлы выкатки — из того же коммита, что и образы: compose.yml и скрипты
      # выпуска должны совпадать с кодом, который они запускают.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.sha }}
          # Полная история — для проверки, что коммит входит в main.
          fetch-depth: 0

      - name: Коммит из main
        env:
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "Коммит $TAG не входит в main: в прод выкатывается только проверенное" >&2
            exit 1
          fi

      - name: Образы опубликованы
        if: inputs.target != 'livekit'
        env:
          REGISTRY: ${{ vars.YC_REGISTRY }}
          TAG: ${{ steps.tag.outputs.sha }}
          REGISTRY_KEY: ${{ secrets.YC_REGISTRY_KEY }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_KEY" | docker login --username json_key --password-stdin cr.yandex
          # imagetools, а не `docker manifest inspect`: тот не читает манифесты
          # OCI и объявлял отсутствующим образ, который в реестре есть, — выкатка
          # падала на пустом месте.
          for image in api migrate web overlay admin; do
            docker buildx imagetools inspect "${REGISTRY}/streamkit-${image}:${TAG}" >/dev/null ||
              { echo "Нет образа streamkit-${image}:${TAG} — выпуск ещё не собран?" >&2; exit 1; }
          done

      - name: SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Отпечатки ВМ заданы заранее: без них выкатка отдала бы секреты любому,
          # кто подменит адрес.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Приложения
        if: inputs.target == 'app' || inputs.target == 'all'
        env:
          HOST: ${{ vars.APP_HOST }}
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/deploy -o StrictHostKeyChecking=yes)
          # Место на диске — ДО копирования файлов, командой по ssh, а не
          # скриптом с ВМ.
          #
          # Уборка есть и в самом deploy.sh, но она бесполезна, когда диск уже
          # полон: сначала выкатка упала на `pull`, потом — на записи окружения
          # из Lockbox, а потом `scp` не смог записать и сам deploy.sh («write
          # remote: Failure»). Обновлённый скрипт до ВМ не доезжал, и конвейер
          # оказался заблокирован без ручного вмешательства. Этот шаг ничего с
          # ВМ не читает и не пишет, поэтому работает и на полном диске.
          #
          # Удаляются образы с тегом-sha, кроме выкатываемого: зеркала caddy и
          # umami помечены версиями. `docker image rm` без `-f` не удалит образ
          # запущенного контейнера — работающий выпуск остаётся на месте.
          # shellcheck disable=SC2087
          ssh "${ssh_opts[@]}" "deploy@${HOST}" bash -s -- "$TAG" <<'CLEANUP'
          set -uo pipefail
          tag=$1
          df -h --output=avail / | tail -1 | xargs echo "Свободно до уборки:"
          docker images --format '{{.Repository}}:{{.Tag}}' |
            grep -E ':[0-9a-f]{40}$' |
            grep -v ":${tag}$" |
            xargs -r -n1 docker image rm >/dev/null 2>&1 || true
          docker image prune -f >/dev/null
          df -h --output=avail / | tail -1 | xargs echo "Свободно после уборки:"
          CLEANUP
          scp "${ssh_opts[@]}" infra/yandex-cloud/app/compose.yml infra/yandex-cloud/app/Caddyfile \
            infra/yandex-cloud/app/deploy.sh infra/yandex-cloud/lib/lockbox.sh "deploy@${HOST}:/opt/streamkit/"
          # Тег подставляется на стороне раннера намеренно: он уже проверен на
          # 40 шестнадцатеричных символов и ничего, кроме них, в команду не несёт.
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "deploy@${HOST}" "chmod +x /opt/streamkit/deploy.sh && /opt/streamkit/deploy.sh ${TAG}"

      - name: Медиасервер
        if: inputs.target == 'livekit' || inputs.target == 'all'
        env:
          HOST: ${{ vars.LIVEKIT_HOST }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/deploy -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" infra/yandex-cloud/livekit/compose.yml infra/yandex-cloud/livekit/deploy.sh \
            infra/yandex-cloud/livekit/renew-cert.sh infra/yandex-cloud/lib/lockbox.sh "deploy@${HOST}:/opt/livekit/"
          ssh "${ssh_opts[@]}" "deploy@${HOST}" \
            "chmod +x /opt/livekit/deploy.sh /opt/livekit/renew-cert.sh && /opt/livekit/deploy.sh"

      - name: Проверка снаружи
        if: inputs.target != 'livekit'
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          set -euo pipefail
          curl -fsS "https://api.${DOMAIN}/api/readyz"
          # Заголовки — по пути страницы, а не по конфигу (грабли с add_header).
          curl -fsSI "https://${DOMAIN}/widgets" | grep -i '^content-security-policy:' >/dev/null
          # Реквизиты продавца заполнены — без них модерация ЮKassa и оферта не пройдут.
          curl -fsS "https://api.${DOMAIN}/api/public/seller" | jq -e '.name and .inn and .email' >/dev/null
          # Админка снаружи закрыта: без пароля Caddy — 401, админское API без
          # пропуска — 404. Сертификат для admin выпускается при первом
          # обращении, поэтому запрос повторяется.
          test "$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 3 "https://admin.${DOMAIN}/")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://api.${DOMAIN}/api/admin/auth/me")" = 404
