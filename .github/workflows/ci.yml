name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: докручивать CI для
# устаревшего коммита незачем.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

jobs:
  # Слияние не гоняет проверки повторно, если ровно этот код их уже прошёл.
  #
  # В пулреквесте CI проверяет не голову ветки, а её слияние с main, и
  # записывает дерево файлов этого слияния. На push в main ворота ищут
  # зелёный прогон пулреквеста с тем же деревом: совпадение значит, что в main
  # лёг байт в байт проверенный код, и остальные задания пропускаются —
  # прогон при этом зелёный, и выпуск образов стартует сразу.
  #
  # Сравнивается дерево, а не sha: коммит слияния новый, а содержимое то же.
  # Если main успел уйти вперёд после последнего прогона пулреквеста, деревья
  # разойдутся, и CI пройдёт целиком — так и должно быть: эту комбинацию никто
  # не проверял.
  gate:
    name: Проверено в пулреквесте
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - name: Дерево проверяемого слияния
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p tested
          git rev-parse 'HEAD^{tree}' > tested/tree

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: tested-tree
          path: tested/tree
          retention-days: 90

      - name: Поиск зелёного прогона пулреквеста
        id: lookup
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
          # Только ветки этого репозитория: прогонам из форков не доверяем.
          heads=$(gh api "repos/$REPO/commits/$SHA/pulls"             --jq ".[] | select(.merged_at != null and .head.repo.full_name == \"$REPO\") | .head.sha")
          for head in $heads; do
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$head"               --jq '.workflow_runs[].id')
            for run in $runs; do
              dir="tested-$run"
              if gh run download "$run" --repo "$REPO" --name tested-tree --dir "$dir" 2>/dev/null                 && [[ "$(cat "$dir/tree")" == "$tree" ]]; then
                echo "Дерево $tree уже проверено прогоном $run — остальные задания пропускаются."
                echo "verified=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo "Проверенного прогона с деревом $tree нет — CI идёт целиком."
          echo "verified=false" >> "$GITHUB_OUTPUT"

  # Кэш зависимостей для новых веток. Ветка читает кэш main, а main при
  # пропуске проверок иначе ничего бы не сохранял: первая сборка каждой новой
  # ветки ставила бы зависимости с нуля.
  cache:
    name: Кэш зависимостей
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  quality:
    name: Типы, линтер, формат, юнит-тесты
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma Client — сгенерированный код, в репозитории его нет.
      # Без этого шага падает проверка типов всего, что трогает БД.
      - run: pnpm --filter @streamkit/api exec prisma generate

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  integration:
    name: Интеграционные тесты
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: streamkit
          POSTGRES_PASSWORD: streamkit
          POSTGRES_DB: streamkit_test
        options: >-
          --health-cmd "pg_isready -U streamkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://streamkit:streamkit@localhost:5432/streamkit_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      # Значения тестовые и одноразовые: боевые секреты живут только в
      # окружении деплоя, в CI их быть не должно.
      #
      # ENCRYPTION_KEY обязан декодироваться ровно в 32 байта. Проверка:
      #   node -e "console.log(Buffer.from(process.argv[1],'base64').length)" <ключ>
      # Здесь это base64 от строки test-encryption-key-32-bytes!!!! длиной 32.
      JWT_SECRET: test-secret-value-for-ci-at-least-32-chars
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyEhISE=
      IP_HASH_PEPPER: test-pepper-for-ci
      TOKEN_HASH_PEPPER: test-token-pepper-for-ci
      CORS_ORIGINS: http://localhost:5173
      OVERLAY_BASE_URL: http://localhost:5174

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @streamkit/contracts build

      # Клиент Prisma — сгенерированный код, в репозитории его нет. Без этого
      # шага падают все четыре набора разом, ещё на импорте: энумы приезжают
      # undefined, и ошибка выглядит как «Cannot read properties of undefined»,
      # а не как «клиент не сгенерирован».
      - run: pnpm --filter @streamkit/api exec prisma generate

      - run: pnpm --filter @streamkit/api exec prisma migrate deploy
      - run: pnpm --filter @streamkit/api test:int

  e2e:
    name: Сквозной сценарий
    runs-on: ubuntu-latest
    # Пропущенный quality пропускает и это задание.
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: streamkit
          POSTGRES_PASSWORD: streamkit
          POSTGRES_DB: streamkit_e2e
        options: >-
          --health-cmd "pg_isready -U streamkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://streamkit:streamkit@localhost:5432/streamkit_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-value-for-ci-at-least-32-chars
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyEhISE=
      IP_HASH_PEPPER: test-pepper-for-ci
      TOKEN_HASH_PEPPER: test-token-pepper-for-ci
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      OVERLAY_BASE_URL: http://localhost:5174
      VITE_API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @streamkit/api exec prisma generate
      - run: pnpm build
      - run: pnpm --filter @streamkit/api exec prisma migrate deploy

      # Настоящий LiveKit для сценария с комнатами — шагом, а не в `services`:
      # сервисному контейнеру нельзя задать команду, а режиму --dev она нужна.
      # Сеть хоста — чтобы адрес узла 127.0.0.1, который LiveKit сообщает
      # браузеру, совпадал с тем, куда браузер на раннере действительно достаёт.
      #
      # Вебхук — на API, который Playwright поднимает на этом же раннере: без
      # него сценарий «гость не входит обратно сохранённым токеном» не пройдёт,
      # выгонять такого гостя больше некому.
      - name: LiveKit для сквозного сценария
        env:
          LIVEKIT_CONFIG: |
            webhook:
              api_key: devkey
              urls:
                - http://127.0.0.1:3000/api/livekit/webhook
        run: |
          docker run -d --name livekit --network host -e LIVEKIT_CONFIG \
            livekit/livekit-server:v1.13.6 --dev --bind 0.0.0.0 --node-ip 127.0.0.1
          curl --silent --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:7880/

      - run: pnpm --filter @streamkit/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @streamkit/e2e test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  security:
    name: Проверки безопасности
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified != 'true'

    # Права выданы явно и по минимуму.
    #
    # Токен workflow по умолчанию только на чтение, и gitleaks падал с
    # «Resource not accessible by integration» — не потому, что нашёл секреты,
    # а потому что не смог оставить комментарий в pull request.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks нужна история, иначе он проверит только последний коммит.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Известные уязвимости в зависимостях. Падаем только на high и critical:
      # иначе пайплайн краснеет от moderate в транзитивных dev-зависимостях и
      # его начинают игнорировать.
      - run: pnpm audit --audit-level high
        continue-on-error: false

      - name: Поиск утёкших секретов
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Комментарии в PR не нужны: результат виден в логе задания, а ради
          # них пришлось бы выдавать токену право записи в pull requests.
          GITLEAKS_ENABLE_COMMENTS: false

  # Конфигурация прода: Terraform, скрипты выкатки и Caddyfile. Ошибка в них
  # иначе проявилась бы только на выкатке — то есть уже на живом сайте.
  infra:
    name: Инфраструктура прода
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform
        working-directory: infra/yandex-cloud/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Скрипты выкатки
        run: shellcheck -x infra/yandex-cloud/app/deploy.sh infra/yandex-cloud/livekit/*.sh infra/yandex-cloud/lib/lockbox.sh

      - name: Caddyfile
        run: |
          # Хэш пароля stats.<домен> — настоящий bcrypt от пароля «ci»: пустой
          # basic_auth не проходит проверку.
          docker run --rm -e DOMAIN=stream-kit.ru -e ACME_EMAIL=ci@stream-kit.ru -e LIVEKIT_PRIVATE_IP=10.10.0.20 \
            -e 'STATS_BASIC_HASH=$2a$14$sJ1VWOJyolWws4klKNbf8uZtpC/Uh02TsKquLsS05A1p2rJJdg796' \
            -v "$PWD/infra/yandex-cloud/app/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Три образа собираются ПАРАЛЛЕЛЬНО, по раннеру на образ, и у каждого СВОЙ
  # кэш. Раньше они шли одним заданием подряд и писали в общий scope кэша
  # GitHub Actions: образ, собранный последним, затирал кэш предыдущего. В
  # логах все три импортировали один и тот же манифест, попаданий в кэш не
  # было, а выгрузка заведомо бесполезного кэша занимала больше половины из
  # восьми минут задания.
  docker:
    name: Сборка образов (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      # Сломанный образ дашборда не должен прятать результат сборки API.
      fail-fast: false
      matrix:
        include:
          - image: api
            file: infra/docker/api.Dockerfile
            target: runtime
            build-args: ''
          # Образ миграций — отдельно: без этой сборки поломка в нём нашлась бы
          # только на выкатке, когда миграции уже нужны.
          - image: migrate
            file: infra/docker/api.Dockerfile
            target: migrate
            build-args: ''
          - image: web
            file: infra/docker/web.Dockerfile
            target: runtime
            build-args: APP=web
          - image: overlay
            file: infra/docker/web.Dockerfile
            target: runtime
            build-args: APP=overlay
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Сборка
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          push: false
          # В локальный Docker загружается только API: его сканирует trivy.
          # Загрузка остальных стоила бы времени, которое никто не использует.
          load: ${{ matrix.image == 'api' }}
          tags: streamkit-${{ matrix.image }}:ci
          # mode=max, а не min: самый дорогой шаг — установка зависимостей — живёт
          # в промежуточной стадии, и min его бы не сохранил.
          # Второй источник — кэш выпуска образов на main: ветка его читает, а
          # свой кэш CI на main при пропуске проверок не обновляется.
          cache-from: |
            type=gha,scope=${{ matrix.image }}
            type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Уязвимости в образе: базовый образ и системные пакеты pnpm audit не видит.
      - name: Сканирование образа API
        if: matrix.image == 'api'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: streamkit-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
