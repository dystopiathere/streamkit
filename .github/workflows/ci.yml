name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      # Правка одних заметок — ADR, CLAUDE.md, README, DESIGN.md — ничего не
      # собирает и не проверяет: прогон на неё стоил бы двадцать оплаченных
      # минут и выпуск образов следом. Файлы из public/ сюда НЕ попадают, даже
      # .md: они уходят в образ, и без зелёного CI на main не выпустятся —
      # их пропускают ворота ниже, а не этот фильтр.
      - '!**/*.md'
      - '!docs/**'
      - '!apps/web/.impeccable/**'
      - 'apps/*/public/**'
  pull_request:
    # ready_for_review — чтобы черновик, переведённый в готовые, получил прогон:
    # пока пулреквест черновик, CI не идёт (см. задание gate).
    types: [opened, synchronize, reopened, ready_for_review]
    # Тот же список, повторённый, а не вынесенный якорем YAML: Actions якоря
    # понимает, а actionlint, которым workflow проверяют перед пушем, — нет.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!apps/web/.impeccable/**'
      - 'apps/*/public/**'

# Новый пуш в ту же ветку отменяет предыдущий прогон: докручивать CI для
# устаревшего коммита незачем.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

jobs:
  # Слияние не гоняет проверки повторно, если ровно этот код их уже прошёл.
  #
  # В пулреквесте CI проверяет не голову ветки, а её слияние с main, и
  # записывает дерево файлов этого слияния. На push в main ворота ищут
  # зелёный прогон пулреквеста с тем же деревом: совпадение значит, что в main
  # лёг байт в байт проверенный код, и остальные задания пропускаются —
  # прогон при этом зелёный, и выпуск образов стартует сразу.
  #
  # Сравнивается дерево, а не sha: коммит слияния новый, а содержимое то же.
  # Если main успел уйти вперёд после последнего прогона пулреквеста, деревья
  # разойдутся, и CI пройдёт целиком — так и должно быть: эту комбинацию никто
  # не проверял.
  #
  # Ещё ворота пропускают правку одной статики — иконок, шрифтов, robots.txt:
  # собирать и тестировать в ней нечего, а выпуск образов на main нужен, иначе
  # новая картинка не доедет до прода. Юридические тексты статикой НЕ считаются:
  # их редакцию сверяет с переводом legal-documents.test.ts.
  gate:
    name: Проверено в пулреквесте
    runs-on: ubuntu-latest
    # Черновик пулреквеста не проверяется: каждый пуш в него стоил бы полного
    # прогона, а нужен он только перед слиянием. Перевод в «готов» запускает CI
    # (ready_for_review выше). Пропущенные ворота пропускают и всё остальное.
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      verified: ${{ steps.static.outputs.only == 'true' || steps.lookup.outputs.verified == 'true' }}
      images: ${{ steps.static.outputs.images }}
      lockfile: ${{ steps.static.outputs.lockfile }}
    steps:
      # Глубина 2 — чтобы у слияния пулреквеста был первый родитель, main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Только статика?
        id: static
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base=HEAD^1
          elif [[ "$BEFORE" =~ ^0+$ ]] || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            echo "Нет предыдущего коммита для сравнения — CI идёт целиком."
            { echo "only=false"; echo "images=true"; echo "lockfile=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          else
            base=$BEFORE
          fi
          only=true
          images=false
          lockfile=false
          # Весь список, без выхода на первом не-статическом файле: по нему же
          # решается, собирать ли образы и сохранять ли кэш зависимостей.
          while IFS= read -r file; do
            case "$file" in
              apps/web/public/legal/*) static=false ;;
              *.md | apps/*/public/* | apps/web/.impeccable/* | packages/ui/fonts/*.woff2) static=true ;;
              *) static=false ;;
            esac
            if [[ "$static" == false && "$only" == true ]]; then
              echo "Не статика: $file"
              only=false
            fi
            # Что может сломать сборку образа, не сломав сборку в `checks`:
            # Dockerfile'ы и конфиги nginx, состав воркспейса и зависимостей,
            # схема Prisma (её генерирует образ), базовый tsconfig и сами
            # workflow сборки. Правку одного исходного кода `pnpm build` в
            # `checks` проверяет тем же сборщиком.
            case "$file" in
              infra/docker/* | .dockerignore | pnpm-lock.yaml | pnpm-workspace.yaml | package.json | \
                */package.json | apps/api/prisma/* | apps/api/prisma.config.ts | packages/config/* | \
                .github/workflows/ci.yml | .github/workflows/release.yml) images=true ;;
            esac
            if [[ "$file" == pnpm-lock.yaml ]]; then lockfile=true; fi
          done < <(git diff --name-only "$base" HEAD)
          if [[ "$only" == true ]]; then
            echo "Изменена только статика — проверки пропускаются."
          else
            echo "Сборка образов в пулреквесте: $images. Изменился lockfile: $lockfile."
          fi
          { echo "only=$only"; echo "images=$images"; echo "lockfile=$lockfile"; } >> "$GITHUB_OUTPUT"

      # Дерево пишется только за настоящую проверку: пропущенный прогон не
      # должен потом засчитываться воротами на main как проверенный.
      - name: Дерево проверяемого слияния
        if: github.event_name == 'pull_request' && steps.static.outputs.only != 'true'
        run: |
          mkdir -p tested
          git rev-parse 'HEAD^{tree}' > tested/tree

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request' && steps.static.outputs.only != 'true'
        with:
          name: tested-tree
          path: tested/tree
          retention-days: 90

      - name: Поиск зелёного прогона пулреквеста
        id: lookup
        if: github.event_name == 'push' && steps.static.outputs.only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
          # Только ветки этого репозитория: прогонам из форков не доверяем.
          heads=$(gh api "repos/$REPO/commits/$SHA/pulls"             --jq ".[] | select(.merged_at != null and .head.repo.full_name == \"$REPO\") | .head.sha")
          for head in $heads; do
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$head"               --jq '.workflow_runs[].id')
            for run in $runs; do
              dir="tested-$run"
              if gh run download "$run" --repo "$REPO" --name tested-tree --dir "$dir" 2>/dev/null                 && [[ "$(cat "$dir/tree")" == "$tree" ]]; then
                echo "Дерево $tree уже проверено прогоном $run — остальные задания пропускаются."
                echo "verified=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done
          echo "Проверенного прогона с деревом $tree нет — CI идёт целиком."
          echo "verified=false" >> "$GITHUB_OUTPUT"

  # Кэш зависимостей для новых веток. Ветка читает кэш main, а main при
  # пропуске проверок иначе ничего бы не сохранял: первая сборка каждой новой
  # ветки ставила бы зависимости с нуля.
  #
  # Только когда lockfile изменился: ключ кэша — его хэш, и с прежним lockfile
  # кэш main уже есть, а задание оплачивалось минутой ради одного «cache hit».
  cache:
    name: Кэш зависимостей
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified == 'true' && github.event_name == 'push' && needs.gate.outputs.lockfile == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  # Типы, юнит-, интеграционные и сквозные тесты — ОДНИМ заданием.
  #
  # Раньше это были три задания, и каждое ставило зависимости заново, а два из
  # них ещё и собирали все приложения: минута установки и полторы сборки
  # оплачивались трижды. GitHub округляет каждое задание вверх до минуты, и на
  # бесплатном плане (2000 минут в месяц на приватный репозиторий) это решало,
  # хватит ли минут до конца месяца. Сквозной сценарий и так ждал проверки
  # типов, так что по времени до результата задание почти не теряет.
  #
  # Базы две, в одном PostgreSQL: интеграционные тесты и сквозной сценарий
  # чистят каждый свою, и общая база сделала бы их зависимыми от порядка.
  checks:
    name: Типы, линтер, юнит-, интеграционные и сквозные тесты
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: streamkit
          POSTGRES_PASSWORD: streamkit
          POSTGRES_DB: streamkit_test
        options: >-
          --health-cmd "pg_isready -U streamkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    env:
      REDIS_URL: redis://localhost:6379
      # Значения тестовые и одноразовые: боевые секреты живут только в
      # окружении деплоя, в CI их быть не должно.
      #
      # ENCRYPTION_KEY обязан декодироваться ровно в 32 байта. Проверка:
      #   node -e "console.log(Buffer.from(process.argv[1],'base64').length)" <ключ>
      # Здесь это base64 от строки test-encryption-key-32-bytes!!!! длиной 32.
      JWT_SECRET: test-secret-value-for-ci-at-least-32-chars
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyEhISE=
      IP_HASH_PEPPER: test-pepper-for-ci
      TOKEN_HASH_PEPPER: test-token-pepper-for-ci
      OVERLAY_BASE_URL: http://localhost:5174

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Локальный кэш turbo между прогонами: сборка, типы и юнит-тесты пакетов,
      # чьи исходники не менялись, берутся из кэша. Правка одного дашборда не
      # пересобирает и не перепроверяет contracts, ui, app-kit и API.
      #
      # Ключ — sha прогона, восстановление — по префиксу: кэш turbo адресуется
      # хэшами содержимого, и устаревшая запись просто не совпадёт. Чужие
      # файлы, которые читают тесты (workflow, соседние index.html), объявлены
      # во входах задач в turbo.json пакетов — иначе их правка не сбросила бы
      # кэш и тест прошёл бы по старому результату.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Prisma Client — сгенерированный код, в репозитории его нет. Без этого
      # шага падает проверка типов всего, что трогает БД, а интеграционные
      # тесты — ещё на импорте: энумы приезжают undefined, и ошибка выглядит как
      # «Cannot read properties of undefined», а не как «клиент не сгенерирован».
      - run: pnpm --filter @streamkit/api exec prisma generate

      # Одна сборка на всё задание — та, что нужна сквозному сценарию. Адрес API
      # вшивается в бандл при сборке: без него сокет дашборда стучится в сам
      # preview, и падает один сценарий окна эфира — похоже на поломку чата.
      - run: pnpm build
        env:
          VITE_API_URL: http://localhost:3000

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - name: Интеграционные тесты
        env:
          DATABASE_URL: postgresql://streamkit:streamkit@localhost:5432/streamkit_test?schema=public
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:5173
        run: |
          pnpm --filter @streamkit/api exec prisma migrate deploy
          pnpm --filter @streamkit/api test:int

      # Своя база сквозного сценария — в том же сервере PostgreSQL.
      - name: База сквозного сценария
        env:
          PGPASSWORD: streamkit
        run: psql -h localhost -U streamkit -d streamkit_test -c 'CREATE DATABASE streamkit_e2e'

      # Настоящий LiveKit для сценария с комнатами — шагом, а не в `services`:
      # сервисному контейнеру нельзя задать команду, а режиму --dev она нужна.
      # Сеть хоста — чтобы адрес узла 127.0.0.1, который LiveKit сообщает
      # браузеру, совпадал с тем, куда браузер на раннере действительно достаёт.
      #
      # Вебхук — на API, который Playwright поднимает на этом же раннере: без
      # него сценарий «гость не входит обратно сохранённым токеном» не пройдёт,
      # выгонять такого гостя больше некому.
      - name: LiveKit для сквозного сценария
        env:
          LIVEKIT_CONFIG: |
            webhook:
              api_key: devkey
              urls:
                - http://127.0.0.1:3000/api/livekit/webhook
        run: |
          docker run -d --name livekit --network host -e LIVEKIT_CONFIG \
            livekit/livekit-server:v1.13.6 --dev --bind 0.0.0.0 --node-ip 127.0.0.1
          curl --silent --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:7880/

      # Браузер Playwright — из кэша по версии пакета: скачивание Chromium
      # занимало треть шага. Системные библиотеки ставятся всегда: они живут
      # вне кэша, в образе раннера.
      - name: Версия Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @streamkit/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @streamkit/e2e exec playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @streamkit/e2e exec playwright install-deps chromium

      - name: Сквозной сценарий
        env:
          DATABASE_URL: postgresql://streamkit:streamkit@localhost:5432/streamkit_e2e?schema=public
          CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
          VITE_API_URL: http://localhost:3000
        run: |
          pnpm --filter @streamkit/api exec prisma migrate deploy
          pnpm --filter @streamkit/e2e test:e2e

      # Кэш turbo сохраняется целиком, вместе с восстановленным, и без уборки
      # рос бы с каждым прогоном. Запись, которую неделю никто не перезаписал,
      # удаляется; понадобится снова — пересоберётся один раз.
      - name: Уборка кэша turbo
        if: always()
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # Безопасность и конфигурация прода — одним заданием: каждое по отдельности
  # шло меньше минуты, а оплачивалось минутой целиком.
  #
  # Конфигурация прода — это Terraform, скрипты выкатки и Caddyfile. Ошибка в
  # них иначе проявилась бы только на выкатке, то есть уже на живом сайте.
  security:
    name: Безопасность и инфраструктура прода
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified != 'true'

    # Права выданы явно и по минимуму.
    #
    # Токен workflow по умолчанию только на чтение, и gitleaks падал с
    # «Resource not accessible by integration» — не потому, что нашёл секреты,
    # а потому что не смог оставить комментарий в pull request.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks нужна история, иначе он проверит только последний коммит.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Известные уязвимости в зависимостях. Падаем только на high и critical:
      # иначе пайплайн краснеет от moderate в транзитивных dev-зависимостях и
      # его начинают игнорировать.
      - run: pnpm audit --audit-level high
        continue-on-error: false

      - name: Поиск утёкших секретов
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Комментарии в PR не нужны: результат виден в логе задания, а ради
          # них пришлось бы выдавать токену право записи в pull requests.
          GITLEAKS_ENABLE_COMMENTS: false

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform
        working-directory: infra/yandex-cloud/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Скрипты выкатки
        run: shellcheck -x infra/yandex-cloud/app/deploy.sh infra/yandex-cloud/livekit/*.sh infra/yandex-cloud/lib/lockbox.sh

      - name: Caddyfile
        run: |
          # Хэш пароля stats.<домен> и admin.<домен> — настоящий bcrypt от пароля
          # «ci»: пустой basic_auth не проходит проверку.
          docker run --rm -e DOMAIN=stream-kit.ru -e ACME_EMAIL=ci@stream-kit.ru -e LIVEKIT_PRIVATE_IP=10.10.0.20 \
            -e 'STATS_BASIC_HASH=$2a$14$sJ1VWOJyolWws4klKNbf8uZtpC/Uh02TsKquLsS05A1p2rJJdg796' \
            -e STATS_GATE_TOKEN=ci-gate \
            -e 'ADMIN_BASIC_HASH=$2a$14$sJ1VWOJyolWws4klKNbf8uZtpC/Uh02TsKquLsS05A1p2rJJdg796' \
            -e ADMIN_GATE_TOKEN=ci-admin-gate \
            -v "$PWD/infra/yandex-cloud/app/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Образы — одним заданием, шаг за шагом, в одном сборщике buildx.
  #
  # Раньше каждый образ собирался на своём раннере, и каждое из пяти заданий
  # округлялось до минуты отдельно и заново поднимало buildx и тянуло общий
  # базовый слой: десять оплаченных минут на прогон при двух с половиной
  # минутах работы. В одном задании общая стадия `base` собирается один раз.
  # Кэш GitHub Actions у каждого образа по-прежнему СВОЙ: общий scope уже
  # подводил — образ, собранный последним, затирал кэш предыдущего.
  #
  # Только в пулреквесте и только когда правка может сломать сборку образа, не
  # сломав `pnpm build` выше: Dockerfile'ы, зависимости, схема Prisma, базовый
  # tsconfig, workflow (список — в воротах). На main те же образы собирает
  # «Выпуск образов», и сломанный образ незамеченным не пройдёт: упадёт выпуск,
  # и выкатывать будет нечего. Образ API на уязвимости выпуск проверяет сам.
  docker:
    name: Сборка образов
    runs-on: ubuntu-latest
    needs: [gate, checks]
    if: github.event_name == 'pull_request' && needs.gate.outputs.images == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # mode=max, а не min: самый дорогой шаг — установка зависимостей — живёт
      # в промежуточной стадии, и min его бы не сохранил. Второй источник —
      # кэш выпуска образов на main: ветка его читает.
      #
      # В локальный Docker загружается только API: его сканирует trivy.
      - name: Образ api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: runtime
          push: false
          load: true
          tags: streamkit-api:ci
          cache-from: |
            type=gha,scope=api
            type=gha,scope=release-api
          cache-to: type=gha,scope=api,mode=max

      # Образ миграций — отдельно: без этой сборки поломка в нём нашлась бы
      # только на выкатке, когда миграции уже нужны.
      - name: Образ migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: migrate
          push: false
          tags: streamkit-migrate:ci
          cache-from: |
            type=gha,scope=migrate
            type=gha,scope=release-migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Образ web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: runtime
          build-args: APP=web
          push: false
          tags: streamkit-web:ci
          cache-from: |
            type=gha,scope=web
            type=gha,scope=release-web
          cache-to: type=gha,scope=web,mode=max

      - name: Образ overlay
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: runtime
          build-args: APP=overlay
          push: false
          tags: streamkit-overlay:ci
          cache-from: |
            type=gha,scope=overlay
            type=gha,scope=release-overlay
          cache-to: type=gha,scope=overlay,mode=max

      - name: Образ admin
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: runtime
          build-args: APP=admin
          push: false
          tags: streamkit-admin:ci
          cache-from: |
            type=gha,scope=admin
            type=gha,scope=release-admin
          cache-to: type=gha,scope=admin,mode=max

      # Уязвимости в образе: базовый образ и системные пакеты pnpm audit не видит.
      - name: Сканирование образа API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: streamkit-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
