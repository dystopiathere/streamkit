name: Выпуск образов

# Образы публикуются только после зелёного CI на main — и только из того
# коммита, который CI проверил (head_sha), а не из того, что лежит в main
# сейчас. Тег образа — полный sha коммита: выкатка берёт тег, и по нему видно,
# какой код в проде.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Ключ реестра и адреса — на уровне репозитория, а не окружения production: сборка
# образа не выкатка, и подтверждение для неё не нужно. Секреты выкатки живут в
# окружении production (deploy.yml).

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  # Пять образов — одним заданием, шаг за шагом, в одном сборщике buildx.
  #
  # Раньше у каждого образа был свой раннер: пять заданий, каждое округлялось
  # до минуты отдельно, поднимало buildx, входило в реестр и собирало общую
  # стадию `base` заново — восемь оплаченных минут на выпуск при трёх минутах
  # работы. Кэш GitHub Actions у каждого образа остался своим (scope
  # release-<образ>): общий scope уже подводил — последний образ затирал кэш
  # предыдущего.
  #
  # Цена: сбой сети на одном образе роняет выпуск целиком, а не один образ. Но
  # выкатке нужны все пять, и повтор задания берёт уже собранное из кэша.
  images:
    name: Образы
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      # Ключ сервисного аккаунта streamkit-ci-pusher: у него только право
      # публиковать образы в реестр, ни к ВМ, ни к секретам доступа нет.
      - name: Вход в Container Registry
        uses: docker/login-action@v4
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_REGISTRY_KEY }}

      # Без аттестаций (provenance, sbom). С ними buildx публикует индекс с
      # дополнительным манифестом in-toto, а Container Registry отвергает такой
      # push целиком: «Cannot read manifest data». Образ собирается под одну
      # платформу ВМ.
      #
      # Адрес API вшивается в статику при сборке. Пустой CSP_CONNECT_EXTRA: в
      # проде API и LiveKit ходят по https и wss, базовой политики хватает.
      # Ссылка на статистику посещений — необязательная переменная репозитория;
      # без неё в обзоре админки ссылки просто нет.
      - name: Образ api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: runtime
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ vars.YC_REGISTRY }}/streamkit-api:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=release-api
          cache-to: type=gha,scope=release-api,mode=max

      - name: Образ migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: migrate
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ vars.YC_REGISTRY }}/streamkit-migrate:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=release-migrate
          cache-to: type=gha,scope=release-migrate,mode=max

      - name: Образ web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: runtime
          build-args: |
            APP=web
            VITE_API_URL=${{ vars.PUBLIC_API_URL }}
            CSP_CONNECT_EXTRA=
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ vars.YC_REGISTRY }}/streamkit-web:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,scope=release-web,mode=max

      - name: Образ overlay
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: runtime
          build-args: |
            APP=overlay
            VITE_API_URL=${{ vars.PUBLIC_API_URL }}
            CSP_CONNECT_EXTRA=
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ vars.YC_REGISTRY }}/streamkit-overlay:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=release-overlay
          cache-to: type=gha,scope=release-overlay,mode=max

      - name: Образ admin
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: runtime
          build-args: |
            APP=admin
            VITE_API_URL=${{ vars.PUBLIC_API_URL }}
            VITE_STATS_URL=${{ vars.PUBLIC_STATS_URL }}
            CSP_CONNECT_EXTRA=
          push: true
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ vars.YC_REGISTRY }}/streamkit-admin:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=release-admin
          cache-to: type=gha,scope=release-admin,mode=max

      # Сторонние образы — копией в свой реестр. ВМ тянут всё только из
      # cr.yandex и не зависят от доступности и лимитов Docker Hub. Версии здесь
      # и в deploy.sh меняются вместе.
      #
      # Шагом задания образов, а не отдельным заданием: копия нужна только при
      # смене версии, а отдельное задание на каждом выпуске стоило минуту,
      # даже когда копировать было нечего. Уже скопированная версия
      # пропускается без обращения к Docker Hub. Шаг идёт ДО сканирования: упавшее
      # сканирование пропустило бы его, и новая версия Caddy не попала бы в реестр.
      - name: Сторонние образы
        timeout-minutes: 15
        env:
          REGISTRY: ${{ vars.YC_REGISTRY }}
        run: |
          set -euo pipefail
          # Копия одной платформы через pull и push, а не imagetools create: тот
          # переносит индекс Docker Hub целиком, с манифестами аттестаций, и
          # Container Registry его не принимает. ВМ — linux/amd64.
          copy() {
            if docker manifest inspect "${REGISTRY}/mirror/$2" >/dev/null 2>&1; then
              echo "$2 уже в реестре"
              return
            fi
            docker pull --platform linux/amd64 "$1"
            docker tag "$1" "${REGISTRY}/mirror/$2"
            docker push "${REGISTRY}/mirror/$2"
          }
          copy caddy:2.10.0 caddy:2.10.0
          copy livekit/livekit-server:v1.13.6 livekit-server:v1.13.6
          copy goacme/lego:v4.21.0 lego:v4.21.0
          copy ghcr.io/umami-software/umami:3.3.1 umami:3.3.1

      # Уязвимости в образе API: базовый образ и системные пакеты pnpm audit не
      # видит. Раньше это делал CI на каждом пуше в main, собирая образ второй
      # раз; теперь CI собирает образы только в пулреквестах, а на main
      # проверяется ровно тот образ, что опубликован. Упавшая проверка
      # оставляет выпуск красным — выкатывать такой тег не нужно.
      - name: Сканирование образа API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.YC_REGISTRY }}/streamkit-api:${{ github.event.workflow_run.head_sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
