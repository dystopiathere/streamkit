name: Выпуск образов

# Образы публикуются только после зелёного CI на main — и только из того
# коммита, который CI проверил (head_sha), а не из того, что лежит в main
# сейчас. Тег образа — полный sha коммита: выкатка берёт тег, и по нему видно,
# какой код в проде.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Ключ реестра и адреса — на уровне репозитория, а не окружения production: сборка
# образа не выкатка, и подтверждение для неё не нужно. Секреты выкатки живут в
# окружении production (deploy.yml).

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  images:
    name: Образ ${{ matrix.image }}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            file: infra/docker/api.Dockerfile
            target: runtime
            build-args: ''
          - image: migrate
            file: infra/docker/api.Dockerfile
            target: migrate
            build-args: ''
          # Адрес API вшивается в статику при сборке. Пустой CSP_CONNECT_EXTRA:
          # в проде API и LiveKit ходят по https и wss, базовой политики хватает.
          - image: web
            file: infra/docker/web.Dockerfile
            target: runtime
            build-args: |
              APP=web
              VITE_API_URL=${{ vars.PUBLIC_API_URL }}
              CSP_CONNECT_EXTRA=
          - image: overlay
            file: infra/docker/web.Dockerfile
            target: runtime
            build-args: |
              APP=overlay
              VITE_API_URL=${{ vars.PUBLIC_API_URL }}
              CSP_CONNECT_EXTRA=
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      # Ключ сервисного аккаунта streamkit-ci-pusher: у него только право
      # публиковать образы в реестр, ни к ВМ, ни к секретам доступа нет.
      - name: Вход в Container Registry
        uses: docker/login-action@v4
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_REGISTRY_KEY }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          push: true
          # Без аттестаций. С ними buildx публикует индекс с дополнительным
          # манифестом in-toto, а Container Registry отвергает такой push целиком:
          # «Cannot read manifest data». Образ собирается под одну платформу ВМ.
          provenance: false
          sbom: false
          platforms: linux/amd64
          tags: ${{ vars.YC_REGISTRY }}/streamkit-${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,scope=release-${{ matrix.image }},mode=max

  # Сторонние образы — копией в свой реестр. ВМ тянут всё только из cr.yandex и
  # не зависят от доступности и лимитов Docker Hub. Версии здесь и в deploy.sh
  # меняются вместе.
  mirror:
    name: Сторонние образы
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Вход в Container Registry
        uses: docker/login-action@v4
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_REGISTRY_KEY }}

      - name: Копирование
        env:
          REGISTRY: ${{ vars.YC_REGISTRY }}
        run: |
          set -euo pipefail
          # Копия одной платформы через pull и push, а не imagetools create: тот
          # переносит индекс Docker Hub целиком, с манифестами аттестаций, и
          # Container Registry его не принимает. ВМ — linux/amd64.
          copy() {
            docker pull --platform linux/amd64 "$1"
            docker tag "$1" "${REGISTRY}/mirror/$2"
            docker push "${REGISTRY}/mirror/$2"
          }
          copy caddy:2.10.0 caddy:2.10.0
          copy livekit/livekit-server:v1.13.6 livekit-server:v1.13.6
          copy goacme/lego:v4.21.0 lego:v4.21.0
