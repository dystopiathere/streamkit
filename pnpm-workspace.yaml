packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# Явный список пакетов, которым разрешено выполнять postinstall-скрипты.
# pnpm блокирует их по умолчанию — это защита цепочки поставок, и каждое
# решение здесь принимается осознанно.
#
#   true  — скрипт нужен для работы пакета (нативные бинарники, генерация клиента)
#   false — скрипт не нужен; пакет работает и без него, зато не выполняет код при установке
allowBuilds:
  esbuild: true # скачивание бинарника сборщика
  '@swc/core': true # нативный трансформер для тестов Nest
  prisma: true # CLI и движки
  '@prisma/client': true # генерация клиента
  '@prisma/engines': true
  protobufjs: false # postinstall нужен только их CLI

# Транзитивные зависимости с уязвимостями, которые нельзя закрыть обновлением
# прямой зависимости: у @nestjs/platform-express патч вышел бы только в 12-й
# мажорной версии, а свежее prisma 6.19.3 в шестёрке уже нет.
#
# Каждая строка — осознанное решение, а не глушение аудита: версия поднимается
# внутри той же мажорной ветки, и после правки прогоняются и тесты, и команды
# Prisma.
overrides:
  # DoS через имена полей multipart. Загрузки файлов в проекте нет, но пакет
  # всё равно уезжает в боевой образ вместе с platform-express.
  multer: '>=2.3.0'
  # Переполнение стека при слиянии рекурсивных структур. Тянется CLI Prisma.
  deepmerge-ts: '>=8.0.0'
